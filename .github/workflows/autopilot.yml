name: Sarkari Alert AI 3-Hour Autopilot

on:
  schedule:
    # Runs automatically every 3 hours (UTC 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00)
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Autopilot Scraper
        run: python autopilot.py

      - name: Commit & Push if New Vacancies Found
        run: |
          git config --global user.name "SarkariAlert-Bot"
          git config --global user.email "bot@sarkarialert.ai"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Autopilot: Ingested latest recruitment notifications [skip ci]" && git push)
